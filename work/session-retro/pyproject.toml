[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-retro-experiment"
version = "0.1.0"
description = "Private bounded Codex session evidence indexing"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "pydantic-settings>=2.14,<3"]

[project.scripts]
session-retro = "session_retro.cli:main"

[tool.setuptools.packages.find]
include = ["session_retro*"]

[tool.black]
line-length = 88
target-version = ["py312"]
