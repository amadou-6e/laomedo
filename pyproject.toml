[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laomedo"
version = "0.1.0"
description = "Design, inspect, and execute agent workflows"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.14.2,<2.16",
    "PyJWT[crypto]==2.15.1",
    "truststore==0.10.4",
]

[project.optional-dependencies]
dev = ["black==26.10.1"]
runner = [
    "py-docker @ git+https://github.com/amadou-6e/py-docker.git@49652f4281b37e62fb43404532a376a3f1f2e07d",
    "agent-client-protocol==0.12.1",
    "pywin32>=304; sys_platform == 'win32'",
]
observability = ["opentelemetry-proto==1.45.1", "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"]

[tool.black]
required-version = "26.10.1"
target-version = ["py310"]
line-length = 88
# Exact archived sources still matching retained evidence; new files stay in scope.
# See docs/architecture/python-formatting.md before changing these exceptions.
force-exclude = '''
^/experiments/(
    exp100/(bundle_transfer|probe_s4_bundle|probe_s4_diag|probe_stage_s8)\.py
  | exp139/(run_flow|verifier_control)\.py
  | feasibility/agent-observability/analyze\.py
)$
'''

[project.scripts]
laomedo-work-graph = "laomedo.work_graph.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["laomedo*"]

[tool.setuptools.package-data]
"laomedo.host.mediation" = ["resources/*.mjs"]
"laomedo.agents.agents.codex" = ["resources/*.toml", "resources/*.json", "resources/*.md", "resources/*LICENSE"]
"laomedo.skills" = ["resources/*/SKILL.md"]
"laomedo.host.publication" = ["resources/*.sh"]
