[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laomedo"
version = "0.1.0"
description = "Design, inspect, and execute agent workflows"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.14.2,<2.16",
    "PyJWT[crypto]==2.15.1",
    "truststore==0.10.4",
]

[project.optional-dependencies]
observability = ["opentelemetry-proto==1.45.1", "opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"]

[project.scripts]
laomedo-work-graph = "laomedo.work_graph.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["laomedo*"]

[tool.setuptools.package-data]
"laomedo.agents" = ["resources/mediation/*.mjs"]
"laomedo.agents.providers.codex" = ["resources/*.toml", "resources/*.json", "resources/*.md", "resources/*LICENSE"]
"laomedo.skills" = ["resources/*/SKILL.md"]
"laomedo.host.publication" = ["resources/*.sh"]
