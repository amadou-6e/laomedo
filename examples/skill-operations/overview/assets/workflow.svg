<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
  <title id="title">PR title feedback workflow</title>
  <desc id="desc">A selected pull request and pinned skill feed an Agent proposal. The host validates authorization, then applies an accepted title update.</desc>
  <rect width="640" height="440" rx="12" fill="#f8fafc"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#0f172a">PR title feedback workflow</text>
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M320 110V138 M312 130L320 138L328 130"/>
    <path d="M320 200V228 M312 220L320 228L328 220"/>
    <path d="M320 290V318 M312 310L320 318L328 310"/>
  </g>
  <rect x="80" y="50" width="480" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="320" y="76" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#0c4a6e">Selected PR + pinned skill</text>
  <text x="320" y="97" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#0c4a6e">The host supplies the target and exact revision</text>
  <rect x="80" y="140" width="480" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="320" y="166" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#4c1d95">Agent proposes a title change</text>
  <text x="320" y="187" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4c1d95">One JSON proposal; no direct GitHub action</text>
  <rect x="80" y="230" width="480" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="320" y="256" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#78350f">Host validates the proposal</text>
  <text x="320" y="277" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#78350f">Target, authorization and permitted title-only change</text>
  <rect x="80" y="320" width="480" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="320" y="346" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#14532d">Accepted title update</text>
  <text x="320" y="367" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14532d">The host applies the operation and reports its result</text>
  <text x="320" y="412" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#475569">A proposal is not a completed update.</text>
</svg>
