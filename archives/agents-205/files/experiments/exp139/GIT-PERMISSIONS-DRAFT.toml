# Proposed only. The active runner still uses laomedo/runner-config.toml.
default_permissions = "container-edit"
approval_policy = "never"

[permissions.container-edit.filesystem]
":root" = "read"
":workspace_roots" = "write"
"/draft/.git" = "write"
"/home/runner/.codex/auth.json" = "deny"

[permissions.container-edit.network]
enabled = false
