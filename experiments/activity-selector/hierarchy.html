<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent activity - hierarchy proposal</title>
<style>
:root{color-scheme:dark;font:14px/1.45 system-ui,sans-serif;color:#ededf1;background:#18181b;--line:#37373d;--muted:#a4a4ad;--accent:#b4a9f3}*{box-sizing:border-box}body{margin:0;min-height:calc(100vh - 36px);display:flex;flex-direction:column}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header.page{border-bottom:1px solid var(--line);padding:18px 24px;font-weight:600}main{padding:28px 24px 48px;width:100%;max-width:1120px;margin:0 auto;flex:1}footer{color:var(--muted);font-size:11px;text-align:center;padding:20px 24px;border-top:1px solid var(--line);margin:0 24px}h1,h2,h3,p{margin:0}h1{font-size:14px}h2{font-size:12px;font-weight:500;color:var(--muted)}.execution{border:1px solid #44444c;border-radius:8px;background:#1d1d21;overflow:hidden}.execution-head{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 20px;border-bottom:1px solid var(--line);background:#222227}.execution-head label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.execution-head select{background:#29292f;border:1px solid #50505b;border-radius:5px;padding:8px 34px 8px 10px;font-size:13px;min-width:235px}.summary{display:flex;gap:20px;align-items:center;font-size:12px;color:var(--muted)}.success{color:#71d6ad}.agents{padding:18px 20px 0}.axis,.row{display:grid;grid-template-columns:minmax(225px,38%) 1fr;align-items:center}.axis{font-size:11px;color:var(--muted);padding-bottom:9px}.ticks{display:flex;justify-content:space-between;padding:0 14px;font-variant-numeric:tabular-nums}.row{width:100%;background:transparent;border:0;border-top:1px solid #303037;min-height:42px;text-align:left;padding:0;border-radius:3px}.row:hover{background:#29292f}.row[aria-pressed=true]{background:#302d3e;box-shadow:inset 2px 0 #b4a9f3}.name{display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:12px}.name strong{font-weight:550}.name.child{padding-left:43px;color:#cccbd3}.chevron{font-size:10px;color:var(--muted);width:9px}.track{padding:10px 14px;position:relative}.bar{height:17px;line-height:15px;background:#0f523c;border:1px solid #237154;border-radius:3px;text-align:center;font-size:10px;color:#8adaba}.row[aria-pressed=true] .bar{border-color:#b4a9f3}.detail{margin:24px 20px 20px;padding:22px;border:1px solid #41404c;border-radius:6px;background:#19191d}.crumbs{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:16px}.crumbs span:last-child{color:var(--accent)}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.detail h3{font-size:16px;font-weight:600}.meta{font-size:11px;color:var(--muted);margin-top:6px}.badge{font-size:10px;border:1px solid #315345;border-radius:4px;padding:2px 6px;color:#71d6ad}.content{margin-top:28px}.section-title{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:16px}.section-title:after{content:'';height:1px;flex:1;background:var(--line)}.answer{font-size:13px}.metrics{display:flex;gap:28px;margin-bottom:28px}.metrics span{display:block;font-size:11px;color:var(--muted)}.metrics strong{display:block;font-size:15px;font-weight:550;margin-top:4px}.small{font-size:11px;color:var(--muted)}.run-label{display:flex;align-items:center;gap:8px}.toggle{background:none;border:0;padding:0;color:var(--muted);font-size:11px}.execution-head select{max-width:100%}@media(max-width:650px){main{padding:20px 12px}.execution-head{align-items:start;flex-direction:column;gap:12px}.summary{gap:12px}.axis,.row{grid-template-columns:minmax(170px,48%) 1fr}.agents{padding:14px 10px 0}.detail{margin:20px 10px 10px;padding:16px}.name{flex-wrap:wrap}.metrics{gap:20px}.crumbs{flex-wrap:wrap}}
</style>
</head>
<body>
<header class="page"><h1>Agent activity</h1></header>
<main><section class="execution" aria-label="Selected graph execution">
<div class="execution-head"><div><label for="execution">Graph execution</label><select id="execution"><option value="0">Today, 08:37:26</option><option value="1">Today, 07:34:08</option></select></div><div class="summary"><span class="success">&#10003; Completed</span><span>2 agent runs</span><span id="execution-duration">8.1s</span></div></div>
<div class="agents"><div class="axis"><div class="run-label"><h2>Agent runs</h2></div><div class="ticks"><span>0s</span><span>4s</span><span>8s</span></div></div>
<div style="position:relative"><button class="toggle" style="width:22px;position:absolute;z-index:1;top:0;bottom:0;left:0" id="toggle" aria-expanded="true" aria-controls="turns" aria-label="Collapse turns">&#9662;</button><button class="row" type="button" data-choice="agent" aria-pressed="true"><span class="name" style="padding-left:28px"><span class="success">&#10003;</span><strong>Laomedo Codex Agent</strong><span class="small">2 turns</span></span><span class="track"><span class="bar" style="display:block;margin-left:5%;width:72%">5.8s</span></span></button></div>
<div id="turns"><button class="row" type="button" data-choice="turn1" aria-pressed="false"><span class="name child"><span class="success">&#10003;</span>Turn 1</span><span class="track"><span class="bar" style="display:block;margin-left:5%;width:58%">4.7s</span></span></button><button class="row" type="button" data-choice="turn2" aria-pressed="false"><span class="name child"><span class="success">&#10003;</span>Turn 2</span><span class="track"><span class="bar" style="display:block;margin-left:63%;width:14%">1.1s</span></span></button></div>
<button class="row" type="button" data-choice="reviewer" aria-pressed="false"><span class="name"><span class="chevron">&#8226;</span><span class="success">&#10003;</span><strong>Claude Reviewer</strong><span class="small">1 turn</span></span><span class="track"><span class="bar" style="display:block;margin-left:76%;width:23%">1.8s</span></span></button></div>
<article class="detail" aria-live="polite"><nav class="crumbs" aria-label="Selected activity"><span id="execution-crumb">08:37:26</span><span aria-hidden="true">/</span><span id="agent-crumb">Laomedo Codex Agent</span><span id="turn-crumb" hidden></span></nav><div class="detail-head"><h3 id="detail-title">Laomedo Codex Agent</h3><span class="badge">Completed</span></div><p class="meta" id="detail-meta">2 turns &middot; 5.8s &middot; gpt-6.1-sol</p><div class="content"><div class="section-title">Usage</div><div class="metrics"><div><span>Input</span><strong id="input-count">9,488</strong></div><div><span>Output</span><strong id="output-count">42</strong></div><div><span>Estimate</span><strong id="cost-count">$0.0034</strong></div></div><div class="section-title">Conversation</div><p class="answer" id="answer">Provider connection works.</p></div></article></section></main>
<footer>&copy; 2026 Laomedo contributors. MIT License.</footer>
<script>
const choices={agent:{title:'Laomedo Codex Agent',meta:'2 turns \u00b7 5.8s \u00b7 gpt-6.1-sol',answer:'Provider connection works.',input:'9,488',output:'42',cost:'$0.0034',agent:'Laomedo Codex Agent'},turn1:{title:'Turn 1',meta:'4.7s \u00b7 gpt-6.1-sol',answer:'Provider connection works.',input:'9,488',output:'8',cost:'$0.0032',agent:'Laomedo Codex Agent'},turn2:{title:'Turn 2',meta:'1.1s \u00b7 gpt-6.1-sol',answer:'Task completed.',input:'512',output:'34',cost:'$0.0002',agent:'Laomedo Codex Agent'},reviewer:{title:'Claude Reviewer',meta:'1 turn \u00b7 1.8s \u00b7 Claude',answer:'The connection is working.',input:'1,024',output:'64',cost:'$0.0010',agent:'Claude Reviewer'}};
function select(key){const data=choices[key];document.querySelectorAll('[data-choice]').forEach(row=>row.setAttribute('aria-pressed',String(row.dataset.choice===key)));document.getElementById('detail-title').textContent=data.title;document.getElementById('detail-meta').textContent=data.meta;document.getElementById('answer').textContent=data.answer;document.getElementById('input-count').textContent=data.input;document.getElementById('output-count').textContent=data.output;document.getElementById('cost-count').textContent=data.cost;document.getElementById('agent-crumb').textContent=data.agent;const turn=document.getElementById('turn-crumb');turn.hidden=!key.startsWith('turn');turn.textContent=key.startsWith('turn')?'/ '+data.title:''}
document.querySelectorAll('[data-choice]').forEach(row=>row.addEventListener('click',()=>select(row.dataset.choice)));
document.getElementById('toggle').addEventListener('click',event=>{const expanded=event.currentTarget.getAttribute('aria-expanded')==='true';event.currentTarget.setAttribute('aria-expanded',String(!expanded));event.currentTarget.setAttribute('aria-label',expanded?'Expand turns':'Collapse turns');event.currentTarget.innerHTML=expanded?'&#9656;':'&#9662;';document.getElementById('turns').hidden=expanded;if(expanded&&document.querySelector('[data-choice^="turn"][aria-pressed="true"]'))select('agent')});
document.getElementById('execution').addEventListener('change',event=>{document.getElementById('execution-crumb').textContent=event.target.value==='0'?'08:37:26':'07:34:08';select('agent')});
</script></body></html>
