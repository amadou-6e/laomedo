name: Work Graph
on: [push, pull_request]
jobs:
  package-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Test synthetic EXP-08 skill materialization in checkout
        run: |
          python -m unittest experiments.exp08.test_probe -v
          python -m experiments.exp08.probe
      - name: Test synthetic EXP-05 probe in checkout
        run: |
          python -m unittest experiments.exp05.test_evidence -v
          python experiments/exp05/probe.py
      - name: Test synthetic EXP-09 replay in checkout
        run: |
          python -m unittest experiments.exp09.test_probe -v
          python -m experiments.exp09.probe
      - name: Test credential-free EXP-100 broker probe in checkout
        run: python -m unittest discover -s experiments/exp100 -p test_probe.py -v
      - name: Test credential-free EXP-104 S7 probe in checkout
        run: python -m unittest discover -s experiments/exp104 -p test_s7_probe.py -v
      - run: laomedo-work-graph import --repo example/work --file examples/work-graph/github-pages.json --output-dir "$RUNNER_TEMP/work-graph"
