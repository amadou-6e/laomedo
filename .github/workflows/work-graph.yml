name: Work Graph
on: [push, pull_request]
jobs:
  package-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Test synthetic EXP-08 skill materialization in checkout
        run: |
          python -m unittest experiments.exp08.test_probe -v
          python -m experiments.exp08.probe
      - run: laomedo-work-graph import --repo example/work --file examples/work-graph/github-pages.json --output-dir "$RUNNER_TEMP/work-graph"
