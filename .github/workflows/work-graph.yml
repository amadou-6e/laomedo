name: Work Graph
on: [push, pull_request]
jobs:
  provider-interface-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check provider interfaces and override compatibility without native runtimes
        run: python -m unittest test_agents.test_architecture.test_provider_contracts -v
        env:
          PYTHONPATH: tests
  docker-runtime-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[runner]'
      - name: Test runner lifecycle and Docker boundary controls without a daemon
        run: python -m unittest discover -s tests/test_agents -t tests -v
  package-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Test credential-free EXP-100 broker probe in checkout
        run: python -m unittest discover -s experiments/exp100 -p test_probe.py -v
      - run: laomedo-work-graph import --repo example/work --file examples/work-graph/github-pages.json --output-dir "$RUNNER_TEMP/work-graph"
