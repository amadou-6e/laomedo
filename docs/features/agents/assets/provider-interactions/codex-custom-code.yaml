    layout: "column"
    children: ["agent", "runtime"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  shared:
    title: "Host: common code and libraries"
    layout: "column"
    children: ["acp", "sdk", "docker"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  container:
    title: "Provider Docker controller"
    layout: "column"
    children: ["adapter", "cli"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  external:
    title: "External service / known gaps"
    layout: "column"
    children: ["model", "gap"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  support:
    title: "Supporting code: location and purpose"
    layout: "row"
    children: ["support_0", "support_1", "support_2", "support_3"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
