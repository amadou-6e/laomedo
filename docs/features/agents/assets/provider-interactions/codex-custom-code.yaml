version: 1
title: "Codex custom code"
header: "Codex | Where the custom code lives and why"
note: "CURRENT candidate 19c7f1f. Blue: Laomedo code. Green: upstream/shared dependencies. Amber: gaps. Provider-relative paths unless host/ or docker/ is shown."
matrix:
  rows: 2
  columns: 4
  cells: [["host", "shared", "container", "external"], ["support", null, null, null]]
  origin: [35, 145]
  column_widths: [350, 350, 350, 300]
  column_gaps: [100, 120, 100]
  row_gaps: [90]
  full_width_rows: ["support"]
nodes:
  agent:
    label_html: "<b>CodexAgent : BaseAgent</b><br/>agent.py; shared ../base/agent.py<br/><br/>Base shares admission and records. This subclass owns native binding, execution and finalization."
    style:
      width: 310
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  runtime:
    label_html: "<b>CodexController</b><br/>controller/service.py + models.py<br/><br/>Build launch policy, own the ACP session and enforce required adapter extensions."
    style:
      width: 310
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  acp:
    label_html: "<b>SHARED: Laomedo ACP bridge</b><br/>../base/acp/session.py + transport.py<br/><br/>Compose the Python ACP SDK and adapt attached Docker stdin/stdout; native policy stays provider-owned."
    style:
      width: 310
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  sdk:
    label_html: "<b>UPSTREAM: ACP Python SDK</b><br/>agent-client-protocol 0.12.1<br/><br/>Implements protocol schemas and JSON-RPC request/response handling."
    style:
      width: 310
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  docker:
    label_html: "<b>SHARED: container libraries</b><br/>py-docker -&gt; Docker SDK -&gt; Engine<br/><br/>Open attached sessions, run jobs, retain ownership receipts and confirm exact-resource cleanup."
    style:
      width: 310
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  adapter:
    label_html: "<b>CUSTOM: patched ACP adapter</b><br/>docker/codex-acp/<br/><br/>LaomedoExtension.ts + native-events.patch preserve raw native events, host policy and precheck."
    style:
      width: 310
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  cli:
    label_html: "<b>Upstream Codex CLI</b><br/>codex app-server<br/><br/>Performs model reasoning, manages native threads and executes admitted native tools."
    style:
      width: 310
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  model:
    label_html: "<b>EXTERNAL: model service</b><br/>Outside the local Docker runner<br/><br/>The native CLI authenticates and sends model requests. ACP does not perform inference."
    style:
      width: 260
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  gap:
    label_html: "<b>Current boundary gap</b><br/>Not a validation claim<br/><br/>Native split sandbox/network isolation is unverified; native parsing still partly shared."
    style:
      width: 260
      height: 180
      fill: "#FFF1DF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_0:
    label_html: "<b>CUSTOM: native launch hooks</b><br/>docker/codex-acp/LaomedoLaunch.ts<br/><br/>Validate host-owned native argv and executable selection; no arbitrary command tunnel."
    style:
      width: 310
      height: 185
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_1:
    label_html: "<b>CUSTOM: optional split executor</b><br/>split/executor.py + models.py<br/><br/>Register a separate command executor and bind its resource identity. Native isolation needs proof."
    style:
      width: 310
      height: 185
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_2:
    label_html: "<b>CUSTOM: native policy resources</b><br/>resources/ + settings.py<br/><br/>Pin image, CLI and reviewed launch/seccomp policy; refuse changed runtime bindings."
    style:
      width: 310
      height: 185
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_3:
    label_html: "<b>CUSTOM: credentials + evidence</b><br/>host/credentials/siwc/; activity/<br/><br/>Host owns ChatGPT sign-in; rollout_export.py retains selected native evidence. Some parsing remains shared."
    style:
      width: 310
      height: 185
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
groups:
