version: 1
title: "2. Tools and credentials"
header: "Claude | 2. Tools and credentials"
note: "Credential path across the top; command requests return through host admission to a separate worker. | Current runtime 19c7f1f. Paths are repository/package-relative as shown."
matrix:
  rows: 1
  columns: 4
  cells: [["col_0", "col_1", "col_2", "col_3"]]
  origin: [45, 150]
  column_gaps: [110, 110, 110]
nodes:
  source:
    label_html: "<b>Existing host login</b><br/>Host-owned credential source<br/><br/>Host signs in/refreshes. Local access-only mirroring is explicitly opt-in."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  docker:
    label_html: "<b>Shared Docker mechanics</b><br/>py-docker -&gt; Docker SDK -&gt; Engine<br/><br/>Create/attach owned containers, execute jobs, retain receipts and reconcile cleanup."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  auth:
    label_html: "<b>Access-only login mirror</b><br/>claude/auth/; resources/write_login.py<br/><br/>Copy only the approved access credential to the dedicated volume; host keeps refresh ownership."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  broker:
    label_html: "<b>Host CommandService</b><br/>claude/container.py; http/<br/><br/>Receive authenticated /command requests and execute admitted worker jobs; mediate GitHub only with a grant."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  profile:
    label_html: "<b>Dedicated Claude profile</b><br/>Mounted access/session volume<br/><br/>Controller reads mirrored access credentials and persists the native session for Resume."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  bridge:
    label_html: "<b>Custom in-container MCP bridge</b><br/>docker/claude/command_mcp.py<br/><br/>Native MCP stdio tool calls become authenticated HTTP requests to the host command service."
    style:
      width: 285
      height: 150
      fill: "#FFF0DF"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  cli:
    label_html: "<b>Claude native runtime</b><br/>claude executable<br/><br/>Native subscription session and telemetry. Controller shell/file tools are disabled."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  worker:
    label_html: "<b>Credential-free command worker</b><br/>Separate Docker container<br/><br/>Admitted draft commands run without network or a credential mount."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
groups:
  col_0:
    title: "Host source / shared Docker"
    layout: "column"
    children: ["source", "docker"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
  col_1:
    title: "Provider host adapters"
    layout: "column"
    children: ["auth", "broker"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
  col_2:
    title: "Controller state / tools"
    layout: "column"
    children: ["profile", "bridge"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
  col_3:
    title: "Controller / separate worker"
    layout: "column"
    children: ["cli", "worker"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
