version: 1
title: "3. Evidence to Activity"
header: "OpenCode | 3. Evidence to Activity"
note: "Data-flow view, not every direct function call. Capture completeness, task completion and cleanup remain separate facts. | Current runtime 19c7f1f. Paths are repository/package-relative as shown."
matrix:
  rows: 1
  columns: 4
  cells: [["col_0", "col_1", "col_2", "col_3"]]
  origin: [45, 150]
  column_gaps: [110, 110, 110]
nodes:
  cli:
    label_html: "<b>Native OpenCode ACP + Agent</b><br/>opencode acp<br/><br/>One upstream process supplies both ACP and native execution. No custom in-container ACP adapter."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  db:
    label_html: "<b>Native session database</b><br/>Persistent mounted sessions/<br/><br/>OpenCode writes native messages and session relations; history export reads a consistent bound tree."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  capture:
    label_html: "<b>Shared AcpCapture</b><br/>agents/activity/acp/capture.py<br/><br/>Retain bound live updates and reconcile offline native records. Completeness is a separate observation."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  reader:
    label_html: "<b>HistoryReader</b><br/>opencode/history/reader.py<br/><br/>After closure, export consistent native session trees without the live credential store."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  projection:
    label_html: "<b>OpenCode Activity projection</b><br/>opencode/activity/projection.py<br/><br/>Interpret native usage, child identity and costs; preserve missing observations."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  activity:
    label_html: "<b>Shared Activity store / projection</b><br/>agents/activity/<br/><br/>Persist and present retained observations. Provider history/projection supplies native identity, child usage and cost facts."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  ui:
    label_html: "<b>Graph Activity viewer</b><br/>Application UI<br/><br/>Show retained native evidence, usage and capture limitations without model work."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
groups:
  col_0:
    title: "Native sources"
    layout: "column"
    children: ["cli", "db"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
  col_1:
    title: "Shared capture / provider history"
    layout: "column"
    children: ["capture", "reader"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
  col_2:
    title: "Provider interpretation"
    layout: "column"
    children: ["projection"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
  col_3:
    title: "Shared application"
    layout: "column"
    children: ["activity", "ui"]
    gap: 80
    style:
      padding: [60, 20, 25, 20]
      min_height: 520
      fill: "#F5F7FA"
      font_size: 15
