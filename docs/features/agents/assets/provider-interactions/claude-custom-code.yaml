version: 1
title: "1. Run and session"
header: "Claude | 1. Run and session"
note: "Blue: shared code. Purple: provider Python. Green: upstream/resources. Orange: custom controller code. | Provider roles #275. Paths are repository/package-relative as shown."
matrix:
  rows: 1
  columns: 5
  cells: [["col_0", "col_1", "col_2", "col_3", "col_4"]]
  origin: [45, 150]
  column_gaps: [110, 110, 110, 110]
nodes:
  entry:
    label_html: "<b>[A] Application interface</b><br/>agents/interface/; agents/agents/base/agent.py<br/><br/>Public operations, run admission and records. Concrete providers implement the native execution hooks."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/interface/bridge.py", "src/laomedo/agents/agents/base/agent.py"]
    graph_reference: "A"
  agent:
    label_html: "<b>[B] Provider agent</b><br/>ClaudeAgent : BaseAgent<br/>claude/agent.py<br/><br/>Own ACP communication and native result interpretation; coordinate skills, output validation and finalization."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/agents/claude/agent.py"]
    graph_reference: "B"
  runtime:
    label_html: "<b>[C] Controller lifecycle</b><br/>ClaudeAgentRuntime + policy<br/>claude/runtime.py; policy.py<br/><br/>Create supervised per-turn controller scopes with explicit mounts, deadline and cleanup policy."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/agents/claude/policy.py", "src/laomedo/agents/agents/claude/models.py"]
    graph_reference: "C"
  acp:
    label_html: "<b>[D] ACP communication</b><br/>agents/agents/base/acp/session.py; transport.py<br/><br/>AcpSession composes the upstream ACP SDK. DockerTransport carries its frames over attached stdin/stdout."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/agents/base/acp/session.py", "src/laomedo/agents/agents/base/acp/transport.py"]
    graph_reference: "D"
  docker:
    label_html: "<b>[E] Docker lifecycle</b><br/>py-docker -&gt; Docker SDK -&gt; Engine<br/><br/>Create/attach owned containers, execute jobs, retain receipts and reconcile cleanup."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "E"
    external_source: "Separate dependencies: py-docker -> Docker SDK -> Docker Engine."
  adapter:
    label_html: "<b>[F] ACP endpoint</b><br/>claude-agent-acp<br/><br/>Translate ACP to native Claude execution; raw SDK messages return through the shared ACP connection."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "F"
    external_source: "Installed upstream claude-agent-acp package."
  cli:
    label_html: "<b>[G] Native agent runtime</b><br/>claude executable<br/><br/>Native subscription session and telemetry. Controller shell/file tools are disabled."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "G"
    external_source: "Upstream native claude runtime installed in its Docker image."
  model:
    label_html: "<b>[H] Model service</b><br/>Outside local Docker<br/><br/>Native Claude performs model requests."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "H"
    external_source: "External model API; no repository source for the service."
