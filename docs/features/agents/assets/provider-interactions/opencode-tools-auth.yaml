version: 1
title: "2. Tools and credentials"
header: "OpenCode | 2. Tools and credentials"
note: "Credential path across the top; command requests return through host admission to a separate worker. | Current runtime 19c7f1f. Paths are repository/package-relative as shown."
matrix:
  rows: 1
  columns: 4
  cells: [["col_0", "col_1", "col_2", "col_3"]]
  origin: [45, 150]
  column_gaps: [110, 110, 110]
nodes:
  source:
    label_html: "<b>[A] Host credential source</b><br/>Host-owned account source<br/><br/>Host setup selects approved access/routing data; no full profile or refresh ownership transfer."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "A"
    external_source: "Existing host login/account state, not repository files."
  docker:
    label_html: "<b>[B] Docker lifecycle</b><br/>py-docker -&gt; Docker SDK -&gt; Engine<br/><br/>Create/attach owned containers, execute jobs, retain receipts and reconcile cleanup."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "B"
    external_source: "Separate dependencies: py-docker -> Docker SDK -> Docker Engine."
  auth:
    label_html: "<b>[C] Credential provisioning</b><br/>Native auth adaptation<br/>opencode/auth/; utils.py<br/><br/>Host setup selects Console credential/routing. Runtime checks expiry and keyed credential binding."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/agents/opencode/auth/utils.py", "src/laomedo/agents/agents/opencode/auth/transport.py", "src/laomedo/agents/agents/opencode/utils.py"]
    graph_reference: "C"
  broker:
    label_html: "<b>[D] Host command gateway</b><br/>Host CommandBroker<br/>opencode/boundary.py; http/<br/><br/>Authenticated remote MCP receives native tool calls and admits credential-free Docker command jobs."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/agents/opencode/boundary.py", "src/laomedo/agents/agents/opencode/http/handler.py", "src/laomedo/agents/agents/opencode/http/server.py"]
    graph_reference: "D"
  profile:
    label_html: "<b>[E] Controller credentials and state</b><br/>Private generated config / auth / sessions<br/><br/>Only admitted skills/config and read-only auth reach the controller. Model-writable project config stays out."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "E"
    external_source: "Admitted private profile/config/session state. Never tracked as source."
  bridge:
    label_html: "<b>[F] Tool-call transport</b><br/>Part of the opencode process<br/><br/>Calls host /mcp directly; this is not another custom adapter."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "F"
    external_source: "Upstream component or runtime state; no custom source file in this repository."
  cli:
    label_html: "<b>[G] Native agent runtime</b><br/>opencode acp<br/><br/>One upstream process supplies both ACP and native execution. No custom in-container ACP adapter."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "G"
    external_source: "Upstream native opencode runtime installed in its Docker image."
  worker:
    label_html: "<b>[H] Command worker</b><br/>Separate Docker container<br/><br/>No network or credential mount. Current image comes from Codex; neutral packaging is still needed."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "H"
    external_source: "Runtime command-worker container, not another provider source module."
