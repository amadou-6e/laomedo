version: 1
title: "2. Tools and credentials"
header: "Codex | 2. Tools and credentials"
note: "OPTIONAL SPLIT PATH. Normal mode uses native execution. App-owned login is only one credential source. | Current runtime 19c7f1f. Paths are repository/package-relative as shown."
matrix:
  rows: 1
  columns: 5
  cells: [["col_0", "col_1", "col_2", "col_3", "col_4"]]
  origin: [45, 150]
  column_gaps: [110, 110, 110, 110]
nodes:
  source:
    label_html: "<b>[A] Host ChatGPT connection</b><br/>host/credentials/siwc/<br/><br/>Optional app-owned login supplies the admitted access credential via CodexAgent; currently allowed only with Codex split mode."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/host/credentials/siwc/connection.py"]
    graph_reference: "A"
  docker:
    label_html: "<b>[B] Shared Docker mechanics</b><br/>py-docker -&gt; Docker SDK -&gt; Engine<br/><br/>Create/attach owned containers, execute jobs, retain receipts and reconcile cleanup."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "B"
    external_source: "Separate dependencies: py-docker -> Docker SDK -> Docker Engine."
  runtime:
    label_html: "<b>[C] CodexController</b><br/>codex/controller/service.py<br/><br/>Own the ACP session, native callbacks, output precheck and exact controller lifetime."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/agents/codex/controller/service.py", "src/laomedo/agents/agents/codex/controller/models.py"]
    graph_reference: "C"
  executor:
    label_html: "<b>[D] Optional split executor</b><br/>codex/split/executor.py; models.py<br/><br/>Controller creates/registers this separate execution resource. Native isolation remains unverified."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: ["src/laomedo/agents/agents/codex/split/executor.py", "src/laomedo/agents/agents/codex/split/models.py"]
    graph_reference: "D"
  profile:
    label_html: "<b>[E] Controller credential/session binding</b><br/>SplitLaunch; profile / environment<br/><br/>Access may be launch-only. Bind native session state separately; no access credential reaches the executor."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "E"
    external_source: "Admitted private profile/config/session state. Never tracked as source."
  cli:
    label_html: "<b>[F] Codex native runtime</b><br/>codex app-server<br/><br/>Upstream native threads, reasoning, model requests and admitted tool execution."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "F"
    external_source: "Upstream native codex runtime installed in its Docker image."
  server:
    label_html: "<b>[G] Credential-free exec-server</b><br/>Separate codex exec-server container<br/><br/>Capability-authenticated WebSocket. Bridge networking; native sandbox isolation remains unverified."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
    source_files: []
    graph_reference: "G"
    external_source: "Upstream codex exec-server in a separate owned container."
