version: 1
title: "OpenCode custom code"
header: "OpenCode | Where the custom code lives and why"
note: "CURRENT candidate 19c7f1f. Blue: Laomedo code. Green: upstream/shared dependencies. Amber: gaps. Provider-relative paths unless host/ or docker/ is shown."
matrix:
  rows: 2
  columns: 4
  cells: [["host", "shared", "container", "external"], ["support", null, null, null]]
  origin: [35, 145]
  column_widths: [350, 350, 350, 300]
  column_gaps: [100, 120, 100]
  row_gaps: [90]
  full_width_rows: ["support"]
nodes:
  agent:
    label_html: "<b>OpenCodeAgent : BaseAgent</b><br/>agent.py; shared ../base/agent.py<br/><br/>Base shares admission and records. This subclass owns native binding, execution and finalization."
    style:
      width: 310
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  runtime:
    label_html: "<b>IsolatedOpenCode</b><br/>boundary.py + models.py<br/><br/>Build isolated controller view; own ACP session, model selection, cancellation and resource closure."
    style:
      width: 310
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  acp:
    label_html: "<b>SHARED: Laomedo ACP bridge</b><br/>../base/acp/session.py + transport.py<br/><br/>Compose the Python ACP SDK and adapt attached Docker stdin/stdout; native policy stays provider-owned."
    style:
      width: 310
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  sdk:
    label_html: "<b>UPSTREAM: ACP Python SDK</b><br/>agent-client-protocol 0.12.1<br/><br/>Implements protocol schemas and JSON-RPC request/response handling."
    style:
      width: 310
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  docker:
    label_html: "<b>SHARED: container libraries</b><br/>py-docker -&gt; Docker SDK -&gt; Engine<br/><br/>Open attached sessions, run jobs, retain ownership receipts and confirm exact-resource cleanup."
    style:
      width: 310
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  adapter:
    label_html: "<b>UPSTREAM: native ACP server</b><br/>opencode acp<br/><br/>ACP is built into OpenCode. No separate adapter package or custom ACP fork is needed."
    style:
      width: 310
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  cli:
    label_html: "<b>Upstream OpenCode CLI</b><br/>same opencode process<br/><br/>Native ACP endpoint and Agent runtime live in one process; owns sessions and model requests."
    style:
      width: 310
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  model:
    label_html: "<b>EXTERNAL: model service</b><br/>Outside the local Docker runner<br/><br/>The native CLI authenticates and sends model requests. ACP does not perform inference."
    style:
      width: 260
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  gap:
    label_html: "<b>Current deployment gaps</b><br/>Missing maintained launch path<br/><br/>Image exists locally, but recipe was archived; no provider CLI/default transport. Output requirements rejected."
    style:
      width: 260
      height: 180
      fill: "#FFF1DF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_0:
    label_html: "<b>CUSTOM: command broker</b><br/>boundary.py: CommandBroker; http/<br/><br/>Expose authenticated remote MCP and dispatch credential-free, network-disabled workers."
    style:
      width: 310
      height: 185
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_1:
    label_html: "<b>CUSTOM: Console auth adaptation</b><br/>auth/ + utils.py<br/><br/>Select approved Console credential/routing, validate expiry and bind the private runtime identity."
    style:
      width: 310
      height: 185
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_2:
    label_html: "<b>CUSTOM: history + Activity</b><br/>history/ + activity/<br/><br/>Export bound session trees after closure; reconcile child usage and project native records for Activity."
    style:
      width: 310
      height: 185
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  support_3:
    label_html: "<b>CURRENT: worker image coupling</b><br/>settings.py: WORKER_IMAGE<br/><br/>Workers reuse the Codex ACP image as a command environment. This needs neutral ownership, not a new ACP adapter."
    style:
      width: 310
      height: 185
      fill: "#FFF1DF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
groups:
  host:
    title: "Laomedo: provider-owned Python"
    layout: "column"
    children: ["agent", "runtime"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  shared:
    title: "Host: common code and libraries"
    layout: "column"
    children: ["acp", "sdk", "docker"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  container:
    title: "Provider Docker controller"
    layout: "column"
    children: ["adapter", "cli"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  external:
    title: "External service / known gaps"
    layout: "column"
    children: ["model", "gap"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
  support:
    title: "Supporting code: location and purpose"
    layout: "row"
    children: ["support_0", "support_1", "support_2", "support_3"]
    gap: 35
    style:
      padding: [55, 20, 25, 20]
      fill: "#F5F7FA"
      font_size: 16
