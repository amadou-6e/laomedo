version: 1
title: "3. Evidence to Activity"
header: "Codex | 3. Evidence to Activity"
note: "Data-flow view, not every direct function call. Capture completeness, task completion and cleanup remain separate facts. | Current runtime 19c7f1f. Paths are repository/package-relative as shown."
matrix:
  rows: 1
  columns: 5
  cells: [["col_0", "col_1", "col_2", "col_3", "col_4"]]
  origin: [45, 150]
  column_gaps: [110, 110, 110, 110]
nodes:
  source:
    label_html: "<b>Native Codex events</b><br/>Native runtime + patched ACP adapter<br/><br/>Custom extension preserves item/thread/terminal events and host policy."
    style:
      width: 285
      height: 150
      fill: "#FFF0DF"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  rollout:
    label_html: "<b>Native rollout files</b><br/>Dedicated profile sessions/<br/><br/>Codex persists thread evidence. Export selects the exact bound thread."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  acp:
    label_html: "<b>Shared ACP bridge + Python SDK</b><br/>agents/agents/base/acp/session.py; transport.py<br/><br/>AcpSession composes the upstream ACP SDK. DockerTransport carries its frames over attached stdin/stdout."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  export:
    label_html: "<b>Explicit rollout export command</b><br/>codex/activity/rollout_export.py<br/><br/>Standalone Docker CLI reads only the selected native thread. This is not automatic Activity ingestion."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  capture:
    label_html: "<b>Controller native callback</b><br/>controller/service.py:_native_event<br/><br/>Bind native identities/completion and retain safe raw/activity receipts."
    style:
      width: 285
      height: 150
      fill: "#F0EAF8"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  retained:
    label_html: "<b>Retained export artifact</b><br/>Explicitly selected output file<br/><br/>An evidence copy produced by the export command; separate from live Activity capture."
    style:
      width: 285
      height: 150
      fill: "#E7F3EC"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  activity:
    label_html: "<b>Shared Activity store / projection</b><br/>agents/activity/<br/><br/>Retain and project observed records for the wider app. Native interpretation is still partly shared."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
  ui:
    label_html: "<b>Graph Activity viewer</b><br/>Application UI<br/><br/>Read retained evidence, usage and uncertainty; no new model request."
    style:
      width: 285
      height: 150
      fill: "#EAF0FA"
      stroke: "#8193A5"
      font_size: 14
      rounded: true
