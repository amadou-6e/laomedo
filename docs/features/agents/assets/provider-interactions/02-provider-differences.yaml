version: 1
title: "2. Current provider differences"
header: "Same ACP client, different native adapters and runtime ownership"
note: "Current candidate, not complete provider parity. Vertical links show responsibility/delegation; the bottom cards record gaps, not execution steps."
matrix:
  rows: 1
  columns: 3
  cells: [["codex", "claude", "opencode"]]
  origin: [30, 140]
  column_gaps: [70, 70]
