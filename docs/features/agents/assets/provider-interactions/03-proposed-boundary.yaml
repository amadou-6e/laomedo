version: 1
title: "3. Proposed parity boundary"
header: "PROPOSED | One application contract, small native runtime adapters"
note: "Not implemented. Awaiting Claude plan review. Do not add identical placeholder files or a new provider framework."
matrix:
  rows: 2
  columns: 3
  cells: [["app", "contract", "providers"], ["infrastructure", null, null]]
  origin: [30, 140]
  column_gaps: [80, 80]
  row_gaps: [100]
  full_width_rows: ["infrastructure"]
nodes:
  public:
    label: "One application contract"
    detail: "Start / Resume / status / cancel; discovery"
    style:
      width: 240
      height: 88
      fill: "#FFFFFF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  base:
    label: "BaseAgent"
    detail: "Shared sequencing, identity and finalization"
    style:
      width: 240
      height: 88
      fill: "#FFFFFF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  runtime:
    label: "BaseAgentRuntime"
    detail: "Narrow native runtime interface"
    style:
      width: 240
      height: 88
      fill: "#FFF1DF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  codex:
    label: "CodexAgentRuntime"
    detail: "Codex launch + native policy"
    style:
      width: 240
      height: 88
      fill: "#FFF1DF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  claude:
    label: "ClaudeAgentRuntime"
    detail: "Claude launch + native policy"
    style:
      width: 240
      height: 88
      fill: "#FFF1DF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  opencode:
    label: "OpenCodeAgentRuntime"
    detail: "OpenCode launch + native policy"
    style:
      width: 240
      height: 88
      fill: "#FFF1DF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  shared:
    label: "Existing shared infrastructure"
    detail: "ACP SDK + transport; py-docker + Docker SDK"
    style:
      width: 350
      height: 88
      fill: "#FFFFFF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
  owned:
    label: "Native ownership in every provider"
    detail: "Auth adaptation, decoding, history, extensions"
    style:
      width: 350
      height: 88
      fill: "#FFFFFF"
      stroke: "#8193A5"
      font_size: 15
      rounded: true
groups:
  app:
    title: "Application-facing boundary"
    layout: "column"
    children: ["public", "base"]
    gap: 38
    style:
      padding: [55, 20, 25, 20]
      fill: "#F3F6FA"
      font_size: 16
  contract:
    title: "Internal runtime contract"
    layout: "column"
    children: ["runtime"]
    gap: 38
    style:
      padding: [55, 20, 25, 20]
      fill: "#FFF8EB"
      font_size: 16
  providers:
    title: "Concrete implementations"
    layout: "column"
    children: ["codex", "claude", "opencode"]
    gap: 38
    style:
      padding: [55, 20, 25, 20]
      fill: "#FFF8EB"
      font_size: 16
  infrastructure:
    title: "Ownership"
    layout: "row"
    children: ["shared", "owned"]
    gap: 70
    style:
      padding: [55, 20, 25, 20]
      fill: "#F3F6FA"
      font_size: 16
edges:
  app_base:
    from: "public"
    to: "base"
    label: ""
    style:
      stroke: "#218168"
      width: 2
      end_arrow: "classic"
      dashed: false
  base_runtime:
    from: "base"
    to: "runtime"
    label: "delegates"
    style:
      stroke: "#BC783D"
      width: 2
      end_arrow: "classic"
      dashed: true
  runtime_codex:
    from: "runtime"
    to: "codex"
    label: "implemented by"
    style:
      stroke: "#BC783D"
      width: 2
      end_arrow: "classic"
      dashed: true
  runtime_claude:
    from: "runtime"
    to: "claude"
    label: ""
    style:
      stroke: "#BC783D"
      width: 2
      end_arrow: "classic"
      dashed: true
  runtime_opencode:
    from: "runtime"
    to: "opencode"
    label: ""
    style:
      stroke: "#BC783D"
      width: 2
      end_arrow: "classic"
      dashed: true
  base_shared:
    from: "base"
    to: "shared"
    label: "reuse"
    style:
      stroke: "#486FA3"
      width: 2
      end_arrow: "classic"
      dashed: true
